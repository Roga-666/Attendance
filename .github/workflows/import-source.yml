name: Import Attendance source

on:
  push:
    paths:
      - "Attendance-import.zip"
      - ".github/workflows/import-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace staging archive with source tree
        run: |
          unzip -q Attendance-import.zip -d .attendance-import
          cp -a .attendance-import/Attendance/. .
          rm -rf .attendance-import
          rm -f Attendance-import.zip
          rm -f .github/workflows/import-source.yml

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Attendance Android source"
          git push
