name: Build signed APK release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build unsigned release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ATTENDANCE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/attendance.keystore"

      - name: Sign and verify APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ATTENDANCE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATTENDANCE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ATTENDANCE_KEY_PASSWORD }}
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          release_apk="Attendance-${GITHUB_REF_NAME}.apk"

          "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/attendance.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$release_apk" \
            "$RUNNER_TEMP/aligned.apk"

          version_name=$("$build_tools/aapt" dump badging "$release_apk" | sed -n "s/package:.*versionName='\([^']*\)'.*/\1/p")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$version_name" = "$tag_version"

          certificate=$("$build_tools/apksigner" verify --verbose --print-certs "$release_apk")
          printf '%s\n' "$certificate"
          printf '%s\n' "$certificate" | grep -qi "cf9005edd2e8a80440741415c8492e085a853d2461a8300364cbcf806289f183"

          sha256sum "$release_apk" > "$release_apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_apk="Attendance-${GITHUB_REF_NAME}.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$release_apk" "$release_apk.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$release_apk" "$release_apk.sha256" \
              --title "Attendance ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
