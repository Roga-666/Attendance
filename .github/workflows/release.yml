name: Build signed APK release

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build unsigned release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ATTENDANCE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/attendance.keystore"

      - name: Sign and verify APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ATTENDANCE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATTENDANCE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ATTENDANCE_KEY_PASSWORD }}
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          version_name=$("$build_tools/aapt" dump badging "$unsigned_apk" | sed -n "s/package:.*versionName='\([^']*\)'.*/\1/p")
          release_tag="v${version_name}"
          release_apk="Attendance-${release_tag}.apk"

          printf 'RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"
          printf 'RELEASE_APK=%s\n' "$release_apk" >> "$GITHUB_ENV"

          "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/attendance.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$release_apk" \
            "$RUNNER_TEMP/aligned.apk"

          signed_version=$("$build_tools/aapt" dump badging "$release_apk" | sed -n "s/package:.*versionName='\([^']*\)'.*/\1/p")
          test "$signed_version" = "$version_name"

          certificate=$("$build_tools/apksigner" verify --verbose --print-certs "$release_apk")
          printf '%s\n' "$certificate"
          printf '%s\n' "$certificate" | grep -qi "cf9005edd2e8a80440741415c8492e085a853d2461a8300364cbcf806289f183"

          sha256sum "$release_apk" > "$release_apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_APK.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_APK" "$RELEASE_APK.sha256" \
              --title "Attendance ${RELEASE_TAG#v}" \
              --generate-notes
          fi
