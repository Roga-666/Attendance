name: Import and verify Attendance 1.1

on:
  push:
    paths:
      - "Attendance-v1.1-source.zip"
      - ".github/workflows/import-v1.1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply source update
        run: |
          unzip -q Attendance-v1.1-source.zip -d .attendance-update
          cp -a .attendance-update/Attendance/. .
          rm -rf .attendance-update
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Package APK and signing tools
        run: |
          mkdir -p artifact/build-tools
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifact/Attendance-v1.1.0-unsigned.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          cp -a "$build_tools"/. artifact/build-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-v1.1-build
          path: artifact
          retention-days: 1
      - name: Publish verified source
        run: |
          rm -f Attendance-v1.1-source.zip
          rm -f .github/workflows/import-v1.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add themes, custom filters, and backup sync"
          git push
