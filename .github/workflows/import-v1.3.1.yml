name: Import and verify Attendance 1.3.1

on:
  push:
    paths:
      - "Attendance-v1.3.1-source.zip"
      - ".github/workflows/import-v1.3.1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply source update
        run: |
          unzip -q Attendance-v1.3.1-source.zip -d .attendance-update
          cp -a .attendance-update/. .
          rm -rf .attendance-update
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-v1.3.1-build
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
      - name: Publish verified source
        run: |
          rm -f Attendance-v1.3.1-source.zip
          rm -f .github/workflows/import-v1.3.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish tardy screen and transparent app icon"
          git push
