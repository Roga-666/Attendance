name: Import and verify Attendance 1.2.0

on:
  push:
    paths:
      - "Attendance-v1.2.0-source.zip"
      - ".github/workflows/import-v1.2.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply source update
        run: |
          unzip -q Attendance-v1.2.0-source.zip -d .attendance-update
          cp -a .attendance-update/Attendance/. .
          rm -rf .attendance-update
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-v1.2.0-build
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
      - name: Publish verified source
        run: |
          rm -f Attendance-v1.2.0-source.zip
          rm -f .github/workflows/import-v1.2.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix attendance editing filters and Drive sync"
          git push
